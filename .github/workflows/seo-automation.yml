name: SEO Automation & Deployment

on:
  schedule:
    # 每周一和周四 UTC 18:00（北京时间凌晨2点）
    - cron: '0 18 * * 1,4'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  seo-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate AI articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=== 生成AI文章 ==="
          python -c "
          import os
          import json
          import urllib.request
          import datetime
          import random

          api_key = os.environ.get('DEEPSEEK_API_KEY', '')
          if not api_key:
              print('未配置DEEPSEEK_API_KEY，跳过文章生成')
              exit(0)

          # 主题库
          topics = [
              '哈萨克斯坦商业中心通风系统设计要点',
              '乌兹别克斯坦地铁站排烟系统规范',
              '中亚地区工业厂房通风设备选型指南',
              '俄罗斯EAC认证通风设备要求详解',
              '吉尔吉斯斯坦医院空调通风系统标准',
              '塔吉克斯坦数据中心冷却通风方案',
              '中亚跨境电商仓库通风除湿解决方案',
              '哈萨克斯坦学校教室通风换气标准',
              '乌兹别克斯坦酒店HVAC系统节能设计',
              '中亚地区食品加工厂通风卫生要求'
          ]

          # 随机选择2个主题
          selected = random.sample(topics, 2)
          today = datetime.date.today().strftime('%Y-%m-%d')

          for i, topic in enumerate(selected):
              print(f'生成文章 {i+1}: {topic}')
              # 这里调用DeepSeek API生成文章
              # 实际实现需要完整的文章生成逻辑
              print(f'  文章 {i+1} 生成完成（示例）')

          print('AI文章生成完成')
          "

      - name: Generate sitemap
        run: |
          echo "=== 生成sitemap ==="
          python -c "
          import os
          import datetime

          base_url = 'https://topventus.com'
          pages = []

          # 扫描所有HTML文件
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.html'):
                      path = os.path.join(root, f).replace('\\\\', '/').lstrip('./')
                      if path == 'index.html':
                          url = base_url + '/'
                      else:
                          url = base_url + '/' + path.replace('.html', '')
                      pages.append(url)

          # 生成sitemap.xml
          today = datetime.date.today().strftime('%Y-%m-%d')
          sitemap = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n'
          sitemap += '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n'
          for url in sorted(set(pages)):
              sitemap += f'  <url>\n    <loc>{url}</loc>\n    <lastmod>{today}</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.8</priority>\n  </url>\n'
          sitemap += '</urlset>'

          with open('sitemap.xml', 'w', encoding='utf-8') as f:
              f.write(sitemap)
          print(f'sitemap.xml已生成，共{len(set(pages))}个URL')
          "

      - name: SEO quality check
        run: |
          echo "=== SEO质量检查 ==="
          python -c "
          import os
          import re

          issues = []
          html_files = []

          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.html'):
                      html_files.append(os.path.join(root, f))

          print(f'检查 {len(html_files)} 个HTML文件')

          for filepath in html_files:
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()

              # 检查title
              title_match = re.search(r'<title>(.*?)</title>', content)
              if not title_match:
                  issues.append(f'{filepath}: 缺少title标签')
              elif len(title_match.group(1)) > 70:
                  issues.append(f'{filepath}: title过长({len(title_match.group(1))}字符)')

              # 检查meta description
              if 'name=\"description\"' not in content and \"name='description'\" not in content:
                  issues.append(f'{filepath}: 缺少meta description')

              # 检查h1
              h1_count = len(re.findall(r'<h1', content))
              if h1_count == 0:
                  issues.append(f'{filepath}: 缺少h1标签')
              elif h1_count > 1:
                  issues.append(f'{filepath}: h1标签过多({h1_count}个)')

          if issues:
              print(f'发现 {len(issues)} 个问题:')
              for issue in issues[:20]:
                  print(f'  - {issue}')
          else:
              print('✓ 未发现SEO问题')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
              echo "没有变更需要提交"
          else
              git commit -m "SEO automation: update sitemap and articles"
              git push
              echo "✓ 变更已提交并推送"
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: topventus
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
