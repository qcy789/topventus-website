name: SEO Automation and Deployment

on:
  schedule:
    - cron: '0 18 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  seo-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (for Lighthouse)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          npm install -g lighthouse

      - name: Generate AI articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=== 生成AI文章 ==="
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "未配置DEEPSEEK_API_KEY，跳过文章生成"
          else
            python ai_article_generator.py
          fi

      - name: Generate social media content
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=== 生成社媒推广文案 ==="
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "未配置DEEPSEEK_API_KEY，跳过社媒内容生成"
          else
            python social_media_generator.py
          fi

      - name: Generate social media meta tags
        run: |
          echo "=== 优化社媒meta标签 ==="
          python -c "
          import os
          import re

          updated = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.html'):
                      filepath = os.path.join(root, f)
                      with open(filepath, 'r', encoding='utf-8') as file:
                          content = file.read()

                      changed = False

                      if 'property=\"og:title\"' not in content:
                          title_match = re.search(r'<title>(.*?)</title>', content)
                          if title_match:
                              title = title_match.group(1)
                              og_tags = f'''
          <meta property=\"og:title\" content=\"{title}\">
          <meta property=\"og:description\" content=\"TopVentus - Professional ventilation equipment manufacturer. Industrial and commercial HVAC solutions.\">
          <meta property=\"og:type\" content=\"website\">
          <meta property=\"og:url\" content=\"https://topventus.com/{filepath.replace('./', '').replace('.html', '')}\">
          <meta property=\"og:image\" content=\"https://topventus.com/images/factory-bg.jpg\">
          <meta name=\"twitter:card\" content=\"summary_large_image\">
          <meta name=\"twitter:title\" content=\"{title}\">
          <meta name=\"twitter:description\" content=\"TopVentus - Professional ventilation equipment manufacturer.\">
          <meta name=\"twitter:image\" content=\"https://topventus.com/images/factory-bg.jpg\">
          '''
                              content = content.replace('</head>', og_tags + '</head>')
                              changed = True

                      if changed:
                          with open(filepath, 'w', encoding='utf-8') as file:
                              file.write(content)
                          updated += 1

          print(f'优化了 {updated} 个页面的社媒meta标签')
          "

      - name: Generate sitemap
        run: |
          python -c "
          import os
          import datetime

          base_url = 'https://topventus.com'
          pages = []

          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.html'):
                      path = os.path.join(root, f).replace('\\\\', '/').lstrip('./')
                      if path == 'index.html':
                          url = base_url + '/'
                      else:
                          url = base_url + '/' + path.replace('.html', '')
                      pages.append(url)

          today = datetime.date.today().strftime('%Y-%m-%d')
          sitemap = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n'
          sitemap += '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n'
          for url in sorted(set(pages)):
              sitemap += '  <url>\n    <loc>' + url + '</loc>\n    <lastmod>' + today + '</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.8</priority>\n  </url>\n'
          sitemap += '</urlset>'

          with open('sitemap.xml', 'w', encoding='utf-8') as f:
              f.write(sitemap)
          print('sitemap.xml generated, ' + str(len(set(pages))) + ' URLs')
          "

      - name: SEO quality check
        run: |
          python -c "
          import os
          import re

          issues = []
          html_files = []

          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.html'):
                      html_files.append(os.path.join(root, f))

          print('Checking ' + str(len(html_files)) + ' HTML files')

          for filepath in html_files:
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()

              title_match = re.search(r'<title>(.*?)</title>', content)
              if not title_match:
                  issues.append(filepath + ': missing title')
              elif len(title_match.group(1)) > 70:
                  issues.append(filepath + ': title too long')

              if 'name=\"description\"' not in content:
                  issues.append(filepath + ': missing meta description')

              h1_count = len(re.findall(r'<h1', content))
              if h1_count == 0:
                  issues.append(filepath + ': missing h1')
              elif h1_count > 1:
                  issues.append(filepath + ': multiple h1')

          if issues:
              print('Found ' + str(len(issues)) + ' issues')
              for issue in issues[:10]:
                  print('  - ' + issue)
          else:
              print('No SEO issues found')
          "

      - name: Submit to search engines (Bing API)
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          echo "=== 提交到Bing搜索引擎 ==="
          if [ -z "$BING_API_KEY" ]; then
            echo "未配置BING_API_KEY，跳过Bing提交"
          else
            python search_engine_submitter.py
          fi

      - name: Submit new URLs via IndexNow (Yandex + Bing)
        env:
          INDEXNOW_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          echo "=== IndexNow自动提交（Yandex + Bing）==="
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "未配置INDEXNOW_KEY，跳过IndexNow提交"
          else
            python indexnow_submitter.py
          fi

      - name: Lighthouse performance audit
        continue-on-error: true
        run: |
          echo "=== Lighthouse性能检查 ==="
          npx lighthouse https://topventus.com --output=json --output-path=./lighthouse-report.json --chrome-flags="--headless --no-sandbox --disable-gpu" --quiet 2>&1 || echo "Lighthouse检查跳过"
          if [ -f lighthouse-report.json ]; then
            echo "Lighthouse报告已生成"
            python -c "
            import json
            with open('lighthouse-report.json', 'r') as f:
                report = json.load(f)
            scores = report.get('categories', {})
            print('性能分数:')
            for key, cat in scores.items():
                print(f'  {cat.get(\"title\", key)}: {int(cat.get(\"score\", 0)*100)}')
            " || echo "解析Lighthouse报告失败"
          else
            echo "Lighthouse报告未生成，跳过"
          fi

      - name: Commit and push changes
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config pull.rebase false
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SEO automation: update articles, social content, sitemap and meta tags" || echo "Commit failed or nothing to commit"
            git pull origin main --no-rebase -X ours || echo "Pull failed, continuing with push"
            git push origin main || echo "Push failed, will deploy from workspace directly"
            echo "Changes committed and pushed (or attempted)"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: topventus
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
