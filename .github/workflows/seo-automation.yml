name: SEO Automation and Deployment

on:
  schedule:
    - cron: '0 18 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  seo-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate AI articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=== 生成AI文章 ==="
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "未配置DEEPSEEK_API_KEY，跳过文章生成"
          else
            python ai_article_generator.py
          fi

      - name: Generate social media meta tags
        run: |
          echo "=== 优化社媒meta标签 ==="
          python -c "
          import os
          import re

          updated = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.html'):
                      filepath = os.path.join(root, f)
                      with open(filepath, 'r', encoding='utf-8') as file:
                          content = file.read()

                      changed = False

                      # 添加Open Graph标签（如果没有）
                      if 'property=\"og:title\"' not in content:
                          title_match = re.search(r'<title>(.*?)</title>', content)
                          if title_match:
                              title = title_match.group(1)
                              og_tags = f'''
          <meta property=\"og:title\" content=\"{title}\">
          <meta property=\"og:description\" content=\"TopVentus - профессиональный производитель вентиляционного оборудования\">
          <meta property=\"og:type\" content=\"website\">
          <meta property=\"og:url\" content=\"https://topventus.com/{filepath.replace('./', '').replace('.html', '')}\">
          <meta name=\"twitter:card\" content=\"summary_large_image\">
          <meta name=\"twitter:title\" content=\"{title}\">
          <meta name=\"twitter:description\" content=\"TopVentus - профессиональный производитель вентиляционного оборудования\">
          '''
                              content = content.replace('</head>', og_tags + '</head>')
                              changed = True

                      if changed:
                          with open(filepath, 'w', encoding='utf-8') as file:
                              file.write(content)
                          updated += 1

          print(f'优化了 {updated} 个页面的社媒meta标签')
          "

      - name: Generate sitemap
        run: |
          python -c "
          import os
          import datetime

          base_url = 'https://topventus.com'
          pages = []

          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.html'):
                      path = os.path.join(root, f).replace('\\\\', '/').lstrip('./')
                      if path == 'index.html':
                          url = base_url + '/'
                      else:
                          url = base_url + '/' + path.replace('.html', '')
                      pages.append(url)

          today = datetime.date.today().strftime('%Y-%m-%d')
          sitemap = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n'
          sitemap += '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n'
          for url in sorted(set(pages)):
              sitemap += '  <url>\n    <loc>' + url + '</loc>\n    <lastmod>' + today + '</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.8</priority>\n  </url>\n'
          sitemap += '</urlset>'

          with open('sitemap.xml', 'w', encoding='utf-8') as f:
              f.write(sitemap)
          print('sitemap.xml generated, ' + str(len(set(pages))) + ' URLs')
          "

      - name: SEO quality check
        run: |
          python -c "
          import os
          import re

          issues = []
          html_files = []

          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.html'):
                      html_files.append(os.path.join(root, f))

          print('Checking ' + str(len(html_files)) + ' HTML files')

          for filepath in html_files:
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()

              title_match = re.search(r'<title>(.*?)</title>', content)
              if not title_match:
                  issues.append(filepath + ': missing title')
              elif len(title_match.group(1)) > 70:
                  issues.append(filepath + ': title too long')

              if 'name=\"description\"' not in content:
                  issues.append(filepath + ': missing meta description')

              h1_count = len(re.findall(r'<h1', content))
              if h1_count == 0:
                  issues.append(filepath + ': missing h1')
              elif h1_count > 1:
                  issues.append(filepath + ': multiple h1')

          if issues:
              print('Found ' + str(len(issues)) + ' issues')
              for issue in issues[:10]:
                  print('  - ' + issue)
          else:
              print('No SEO issues found')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SEO automation: update articles, sitemap and meta tags"
            git push
            echo "Changes committed and pushed"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: topventus
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
